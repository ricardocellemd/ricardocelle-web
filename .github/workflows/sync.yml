name: Sincronizar web desde la copia
on:
  push:
    paths: ['.github/workflows/sync.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar la web
        run: |
          set -e
          B=https://ricardocelle-crm.pages.dev/app/promo/web
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          curl -fsS "$B/_manifest.json" | jq -r '.[]' > /tmp/list.txt
          while read -r f; do mkdir -p "$(dirname "$f")"; curl -fsS "$B/$f" -o "$f"; done < /tmp/list.txt
          touch .nojekyll
          find . -type f ! -path './.git/*' | wc -l
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Web completa
